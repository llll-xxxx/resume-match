name: Release Windows app

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing Git tag to publish
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run desktop:build
      - name: Create release and upload installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          $assets = Get-ChildItem release -Filter *.exe | ForEach-Object FullName
          if (-not $assets) { throw "No Windows installer was produced." }
          $arguments = @("release", "create", $env:RELEASE_TAG, "--verify-tag", "--generate-notes", "--title", $env:RELEASE_TAG)
          if ($env:RELEASE_TAG -match "-") { $arguments += "--prerelease" }
          $arguments += $assets
          gh @arguments
